[package]
name = "evidencia-cinnosti"
version = "0.1.0"
description = "Offline desktop aplikácia pre psychologickú poradňu"
authors = ["apankuch"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "evidencia_cinnosti_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
