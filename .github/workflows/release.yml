name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: # manual trigger from Actions tab (buildne bez release)

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # to create the GitHub Release + upload assets

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # only create/attach a release when triggered by a v* tag
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('Evidencia činnosti {0}', github.ref_name) || '' }}
          releaseDraft: true # publikuješ ručne cez GitHub UI po skontrolovaní
          prerelease: false
